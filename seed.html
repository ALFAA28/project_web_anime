            messagingSenderId: "803774280365",

                    ]
                },
                {
                    title: "Demon Slayer: Kimetsu no Yaiba",
                    title_jp: "鬼滅の刃",

            async function seed() {
                try {
                    for (const data of dummyDataList) {
                        await addDoc(animeCollection, {
                            ...data,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        });
                    }
                    document.getElementById('status').innerText = "SUKSES! 5 Data dummy berhasil di-push ke Firebase.";
                    document.getElementById('status').style.color = "#10b981";
                    document.getElementById('action').style.display = "block";
                } catch (e) {
                    console.error(e);
                    document.getElementById('status').innerText = "GAGAL! Cek console browser. (Pastikan Anda sudah login atau rule Firestore mengizinkan write).";
                    document.getElementById('status').style.color = "#ef4444";
                }
            }

            seed();
        } catch (err) {
            document.getElementById('status').innerText = "ERROR SETUP: " + err.message;
            document.getElementById('status').style.color = "#ef4444";
        }
    </script>
